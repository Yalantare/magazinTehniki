name: shop

services:
  server:
    build:
      context: .
    ports:
      - 8090:8080
    environment:
      - DB_HOST=db
      - DB_PORT=3306
      - DB_NAME=shop
      - DB_USER=root
      - DB_PASSWORD=root
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - .:/app

  db:
    image: mysql:8.0
    user: root
    volumes:
      - db-data:/var/lib/mysql
    environment:
      - MYSQL_DATABASE=shop
      - MYSQL_ROOT_PASSWORD=root
    expose:
      - 3306
    healthcheck:
      test: [ "CMD", "mysqladmin", "ping", "-h", "localhost" ]
      interval: 10s
      timeout: 5s
      retries: 5
volumes:
  db-data:
